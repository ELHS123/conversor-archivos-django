<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Conversor Studio{% endblock %}</title>
    <!-- Cargamos Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-text: #1d1d1f;
            --apple-card: #ffffff;
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
        }
        body {
            background-color: var(--apple-bg);
            color: var(--apple-text);
            /* Tipografía nativa de Apple */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .navbar {
            background-color: rgba(255, 255, 255, 0.7) !important;
            backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .navbar-brand {
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .apple-card {
            background: var(--apple-card);
            border-radius: 24px;
            border: none;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        a.apple-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            color: inherit;
        }
        .apple-btn {
            background-color: var(--apple-blue);
            color: white;
            border-radius: 980px;
            padding: 12px 24px;
            font-weight: 500;
            border: none;
            transition: background-color 0.2s, transform 0.1s;
        }
        .apple-btn:hover {
            background-color: var(--apple-blue-hover);
            color: white;
        }
        
        /* Iconos estilo iOS dentro de las cards */
        .icon-box {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-excel {
            background: linear-gradient(135deg, #e6f4ea 0%, #ceead6 100%);
            color: #188038;
        }
        .icon-word {
            background: linear-gradient(135deg, #e8f0fe 0%, #d2e3fc 100%);
            color: #1967d2;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'conversor_app:home' %}">Conversor Studio</a>
        </div>
    </nav>
    <main class="container" style="margin-top: 100px; padding-bottom: 60px;">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
